[project]
name = "rttpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "oskarwsson", email = "oskar.wilhelmsson00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "open3d>=0.19.0",
    "pillow>=12.3.0",
    "torchvision>=0.29.0",
    "transformers[torch]>=5.17.0",
]

[project.scripts]
